[project]
name = "podreel-asd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marius Eikenes", email = "hello@mariuseikenes.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "gdown>=6.3.0",
    "httpx>=0.28.1",
    "mediapipe>=1.0.1",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "python-speech-features>=0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "tqdm>=4.66.5",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
podreel-asd = "podreel_asd:main"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"
